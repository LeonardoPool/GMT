<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=1440" />
		<style>
			html {
				zoom: calc(100vw / 1440);
				overflow-x: hidden;
			}
			body {

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">

	</body>
</html>
